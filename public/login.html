<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members Login — Regulators MC Palm Bay, FL</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/centerpiece.jpg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #2a1145 0%, #0d0b10 100%);
  font-family: "Barlow", "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
}
.card {
  background: #17131d;
  border: 1px solid #4b1f7a;
  border-radius: 8px;
  padding: 2rem;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 0 30px rgba(123, 47, 191, 0.2);
}
.header {
  text-align: center;
  margin-bottom: 2rem;
  border-bottom: 2px solid #7b2fbf;
  padding-bottom: 1rem;
}
.header h1 {
  font-family: "Oswald", sans-serif;
  font-size: 1.8rem;
  color: #eeeef2;
  margin: 0 0 0.5rem 0;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.header p {
  color: #b98ae8;
  font-size: 0.9rem;
  letter-spacing: 0.05em;
  margin: 0;
}
.card h2 {
  font-family: "Oswald", sans-serif;
  font-size: 1.3rem;
  color: #eeeef2;
  margin-bottom: 1.5rem;
  text-align: center;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.form-group {
  margin-bottom: 1.2rem;
}
.form-group label {
  display: block;
  color: #c9c9d1;
  font-size: 0.9rem;
  margin-bottom: 0.5rem;
  font-weight: 600;
}
.form-group input {
  width: 100%;
  padding: 0.7rem;
  background: #0d0b10;
  border: 1px solid #4b1f7a;
  border-radius: 4px;
  color: #eeeef2;
  font-size: 1rem;
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-group input:focus {
  outline: none;
  border-color: #7b2fbf;
  box-shadow: 0 0 8px rgba(123, 47, 191, 0.3);
}
.form-group input:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.submit {
  width: 100%;
  padding: 0.8rem;
  background: #7b2fbf;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-family: "Oswald", sans-serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s;
}
.submit:hover:not(:disabled) {
  background: #9345d6;
}
.submit:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}
.error {
  background: rgba(212, 43, 30, 0.15);
  border: 1px solid #d42b1e;
  border-radius: 4px;
  padding: 0.8rem;
  color: #ff6b5a;
  margin-bottom: 1rem;
  font-size: 0.9rem;
  display: none;
}
.error.show { display: block; }
.success {
  background: rgba(75, 192, 75, 0.15);
  border: 1px solid #4bc04b;
  border-radius: 4px;
  padding: 0.8rem;
  color: #6fd36f;
  margin-bottom: 1rem;
  font-size: 0.9rem;
  display: none;
}
.success.show { display: block; }
.note {
  text-align: center;
  color: #b98ae8;
  font-size: 0.85rem;
  margin-top: 1rem;
  margin-bottom: 0;
  font-style: italic;
}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Regulators MC</h1>
    <p>Palm Bay, FL</p>
  </div>

  <h2>Members Login</h2>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" required disabled />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" required disabled />
    </div>

    <button type="submit" class="submit" disabled>Login</button>
  </form>

  <p class="note">
    Members portal coming soon. Contact the chapter for access.
  </p>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorDiv = document.getElementById('error');
  const successDiv = document.getElementById('success');
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  errorDiv.classList.remove('show');
  successDiv.classList.remove('show');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      errorDiv.textContent = data.error || 'Login failed';
      errorDiv.classList.add('show');
      return;
    }

    successDiv.textContent = 'Login successful! Redirecting...';
    successDiv.classList.add('show');

    setTimeout(() => {
      if (data.user.role === 'master-admin' || data.user.role === 'officer') {
        window.location.href = '/admin/dashboard';
      } else {
        window.location.href = '/members';
      }
    }, 500);
  } catch (err) {
    errorDiv.textContent = 'An error occurred. Please try again.';
    errorDiv.classList.add('show');
  }
});

// Enable the form for logins
document.getElementById('email').disabled = false;
document.getElementById('password').disabled = false;
document.querySelector('.submit').disabled = false;
</script>

</body>
</html>
