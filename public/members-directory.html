<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Directory — Regulators MC Palm Bay, FL</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/centerpiece.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<style>
body { background: #0d0b10; }
.container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.2rem; }
.portal-card { background: #17131d; border: 1px solid #4b1f7a; border-top: 3px solid #7b2fbf; border-radius: 8px; padding: 2rem; margin-bottom: 1.5rem; }
.portal-card h2 { color: #eeeef2; margin-bottom: 1rem; font-family: "Oswald", sans-serif; }
.back-link { display: inline-block; margin-bottom: 1.2rem; color: #b98ae8; text-decoration: none; }
.back-link:hover { color: #eeeef2; }

.filter-bar { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.filter-tab { padding: 0.4rem 1rem; background: #0d0b10; border: 1px solid #4b1f7a; border-radius: 999px; color: #c9c9d1; cursor: pointer; font-family: "Oswald", sans-serif; letter-spacing: 0.04em; font-size: 0.85rem; }
.filter-tab.active { background: #7b2fbf; border-color: #7b2fbf; color: #fff; }

.directory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
.member-card { background: #0d0b10; border: 1px solid #4b1f7a; border-top: 3px solid #4b1f7a; border-radius: 6px; padding: 1.2rem; }
.member-card.is-officer { border-top-color: #7b2fbf; }
.member-card.is-loa { border-top-color: #d4a72b; }
.member-card .position-badge { display: inline-block; background: rgba(123,47,191,0.2); color: #c9a3e8; border: 1px solid #7b2fbf; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 0.5rem; margin-right: 0.4rem; }
.member-card .loa-badge { display: inline-block; background: rgba(212,167,43,0.18); color: #e8c96a; border: 1px solid #d4a72b; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 0.5rem; }
.member-card .loa-notes { color: #e8c96a; font-size: 0.8rem; margin-top: 0.3rem; }
.login-indicator { display: inline-flex; align-items: center; gap: 0.35rem; color: #6fd36f; font-size: 0.75rem; margin-top: 0.6rem; }
.login-indicator .dot { width: 7px; height: 7px; border-radius: 50%; background: #6fd36f; display: inline-block; flex-shrink: 0; }
.no-login-indicator { display: inline-flex; align-items: center; gap: 0.35rem; color: #7a7a85; font-size: 0.75rem; margin-top: 0.6rem; }
.no-login-indicator .dot { width: 7px; height: 7px; border-radius: 50%; background: #4b1f7a; display: inline-block; flex-shrink: 0; }
.special-badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 0.5rem; margin-right: 0.4rem; }
.special-badge.lifer { background: rgba(212,167,43,0.2); color: #f0d98c; border: 1px solid #d4a72b; }
.special-badge.retiree { background: rgba(201,201,209,0.15); color: #eeeef2; border: 1px solid #c9c9d1; }
.member-card .riding-name { color: #eeeef2; font-family: "Oswald", sans-serif; font-size: 1.15rem; margin-bottom: 0.15rem; }
.member-card .legal-name { color: #7a7a85; font-size: 0.85rem; margin-bottom: 0.7rem; }
.member-card .detail-row { color: #c9c9d1; font-size: 0.85rem; margin-bottom: 0.3rem; }
.member-card .detail-row a { color: #c9c9d1; text-decoration: none; }
.member-card .detail-row a:hover { color: #b98ae8; }
.member-card .since { color: #b98ae8; font-size: 0.8rem; margin-top: 0.6rem; }
.member-card .card-actions { margin-top: 0.8rem; display: flex; gap: 0.4rem; }

.former-list { display: flex; flex-direction: column; gap: 0; }
.former-row { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid #2a1145; flex-wrap: wrap; gap: 0.5rem; }
.former-row:last-child { border-bottom: none; }
.former-row .riding-name { color: #eeeef2; font-family: "Oswald", sans-serif; }
.former-row .legal-name { color: #7a7a85; font-size: 0.85rem; margin-left: 0.5rem; }
.former-row .years { color: #7a7a85; font-size: 0.85rem; }

.icon-btn { background: none; border: 1px solid #4b1f7a; color: #c9c9d1; padding: 0.2rem 0.55rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
.icon-btn:hover { border-color: #7b2fbf; color: #eeeef2; }
.icon-btn.danger { border-color: #d42b1e; color: #ff6b5a; }
.icon-btn.danger:hover { background: rgba(212,43,30,0.1); }

.form-group { margin-bottom: 1rem; }
.form-group label { display: block; color: #c9c9d1; font-size: 0.9rem; margin-bottom: 0.4rem; font-weight: 600; }
.form-group input, .form-group select { width: 100%; padding: 0.65rem; background: #0d0b10; border: 1px solid #4b1f7a; border-radius: 4px; color: #eeeef2; font-family: inherit; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
.submit-btn { padding: 0.7rem 1.5rem; background: #7b2fbf; color: #fff; border: none; border-radius: 4px; font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; }
.submit-btn:hover { background: #9345d6; }
.cancel-edit-btn { padding: 0.7rem 1.2rem; background: transparent; border: 1px solid #4b1f7a; color: #c9c9d1; border-radius: 4px; font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; margin-left: 0.6rem; }

.loading-text { color: #b98ae8; padding: 1rem 0; }
.error-text { color: #ff6b5a; padding: 0.5rem 0; display: none; }
.error-text.show { display: block; }
</style>
</head>
<body>

<header>
  <div class="nav-bar">
    <a class="nav-brand" href="index.html">
      <img src="assets/centerpiece.jpg" alt="Regulators MC logo">
      <span>Regulators MC<small>Palm Bay, FL</small></span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="#" onclick="signOutAndRedirect()">Logout</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="container">
  <a class="back-link" href="members.html">&larr; Back to Portal</a>

  <div class="portal-card" id="formCard" style="display:none;">
    <h2 id="formTitle">Add a Member</h2>
    <div id="formError" class="error-text"></div>
    <form id="memberForm">
      <div class="form-row">
        <div class="form-group">
          <label for="mPosition">Position (officers only)</label>
          <select id="mPosition">
            <option value="">— Member —</option>
            <option value="President">President</option>
            <option value="Vice President">Vice President</option>
            <option value="Secretary">Secretary</option>
            <option value="Treasurer">Treasurer</option>
            <option value="SAA">Sergeant at Arms</option>
            <option value="Road Captain">Road Captain</option>
            <option value="PRO">PRO</option>
          </select>
        </div>
        <div class="form-group">
          <label for="mStatus">Status</label>
          <select id="mStatus">
            <option value="active">Active</option>
            <option value="loa">On Leave (LOA)</option>
            <option value="former">Former</option>
          </select>
        </div>
        <div class="form-group" id="statusYearGroup" style="display:none;">
          <label for="mStatusYear">Year Left</label>
          <input id="mStatusYear" type="number" min="2000" max="2100" />
        </div>
      </div>
      <div class="form-row" id="loaFieldsGroup" style="display:none;">
        <div class="form-group">
          <label for="mLoaStart">On Leave Since</label>
          <input id="mLoaStart" type="date" />
        </div>
        <div class="form-group">
          <label for="mLoaNotes">Leave Notes (optional)</label>
          <input id="mLoaNotes" type="text" placeholder="e.g. military deployment" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="mLoaYearsTotal">Total Years on LOA (past + current, subtracted from tenure)</label>
          <input id="mLoaYearsTotal" type="number" step="0.1" min="0" value="0" />
        </div>
        <div class="form-group">
          <label for="mSpecialStatus">Lifer / Retiree</label>
          <select id="mSpecialStatus">
            <option value="">— None —</option>
            <option value="lifer">Lifer</option>
            <option value="retiree">Retiree</option>
          </select>
        </div>
        <div class="form-group" id="specialStatusDateGroup" style="display:none;">
          <label for="mSpecialStatusDate">Date Status Attained</label>
          <input id="mSpecialStatusDate" type="date" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="mRidingName">Riding Name</label>
          <input id="mRidingName" type="text" required />
        </div>
        <div class="form-group">
          <label for="mLegalName">Legal Name</label>
          <input id="mLegalName" type="text" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="mPhone">Phone</label>
          <input id="mPhone" type="tel" placeholder="555-555-5555" />
        </div>
        <div class="form-group">
          <label for="mEmail">Email</label>
          <input id="mEmail" type="email" />
        </div>
        <div class="form-group">
          <label for="mBirthday">Birthday</label>
          <input id="mBirthday" type="text" placeholder="e.g. Aug 13" />
        </div>
        <div class="form-group">
          <label for="mColorsYear">Colors Year</label>
          <input id="mColorsYear" type="number" min="2000" max="2100" />
        </div>
      </div>
      <button type="submit" class="submit-btn" id="mSubmit">Save Member</button>
      <button type="button" class="cancel-edit-btn" id="mCancelBtn" style="display:none;" onclick="resetMemberForm()">Cancel</button>
    </form>
  </div>

  <div class="portal-card">
    <h2>Member Directory</h2>
    <div class="filter-bar">
      <div class="filter-tab active" data-filter="active" onclick="setFilter('active')">Active</div>
      <div class="filter-tab" data-filter="loa" onclick="setFilter('loa')">On Leave</div>
      <div class="filter-tab" data-filter="former" onclick="setFilter('former')">Former</div>
    </div>
    <div id="directoryList" class="loading-text">Loading...</div>
  </div>
</div>

<script>
const POSITION_WEIGHT = { 'President': 0, 'Vice President': 1, 'Secretary': 2, 'Treasurer': 3, 'SAA': 4, 'Road Captain': 5, 'PRO': 6 };
let currentProfile = null;
let allMembers = [];
let loginEmails = new Set();
let activeFilter = 'active';
let editingId = null;

async function init() {
  const auth = await requireAuth();
  if (!auth) return;
  currentProfile = auth.profile;

  if (isOfficerTier(currentProfile.role)) {
    document.getElementById('formCard').style.display = 'block';
  }

  document.getElementById('mStatus').addEventListener('change', (e) => {
    document.getElementById('statusYearGroup').style.display = e.target.value === 'former' ? 'block' : 'none';
    document.getElementById('loaFieldsGroup').style.display = e.target.value === 'loa' ? 'grid' : 'none';
  });

  document.getElementById('mSpecialStatus').addEventListener('change', (e) => {
    document.getElementById('specialStatusDateGroup').style.display = e.target.value ? 'block' : 'none';
  });

  await loadMembers();
}

async function loadMembers() {
  const listDiv = document.getElementById('directoryList');
  const [{ data: roster, error: rosterError }, { data: profiles, error: profError }] = await Promise.all([
    sb.from('member_roster').select('*'),
    sb.from('profiles').select('email')
  ]);

  if (rosterError || profError) {
    listDiv.className = 'loading-text';
    listDiv.textContent = 'Could not load the directory.';
    return;
  }

  allMembers = roster || [];
  loginEmails = new Set((profiles || []).map(p => (p.email || '').toLowerCase()));
  render();
}

function setFilter(filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(el => el.classList.toggle('active', el.dataset.filter === filter));
  render();
}

function tenureLabel(m) {
  if (!m.colors_year) return '';
  const rawYears = new Date().getFullYear() - m.colors_year;
  const adjusted = rawYears - (Number(m.loa_years_total) || 0);
  const adjustedNote = m.loa_years_total > 0 ? ` — ${m.loa_years_total} yr${m.loa_years_total === 1 ? '' : 's'} on LOA excluded` : '';
  return `Colors since ${m.colors_year} (${adjusted} yrs${adjustedNote})`;
}

function loginBadge(m) {
  if (!m.email) return '';
  const hasLogin = loginEmails.has(m.email.toLowerCase());
  return hasLogin
    ? `<div class="login-indicator"><span class="dot"></span>Has portal login</div>`
    : `<div class="no-login-indicator"><span class="dot"></span>No portal login</div>`;
}

function render() {
  const listDiv = document.getElementById('directoryList');
  const canManage = isOfficerTier(currentProfile.role);
  const members = allMembers.filter(m => m.status === activeFilter);

  if (members.length === 0) {
    listDiv.className = 'loading-text';
    const labels = { active: 'active', loa: 'on-leave', former: 'former' };
    listDiv.textContent = `No ${labels[activeFilter] || activeFilter} members on file.`;
    return;
  }

  if (activeFilter === 'active' || activeFilter === 'loa') {
    const sorted = [...members].sort((a, b) => {
      const aw = a.position && POSITION_WEIGHT[a.position] !== undefined ? POSITION_WEIGHT[a.position] : 99;
      const bw = b.position && POSITION_WEIGHT[b.position] !== undefined ? POSITION_WEIGHT[b.position] : 99;
      if (aw !== bw) return aw - bw;
      return a.riding_name.localeCompare(b.riding_name);
    });

    listDiv.className = 'directory-grid';
    listDiv.innerHTML = sorted.map(m => `
      <div class="member-card ${m.status === 'loa' ? 'is-loa' : (m.position ? 'is-officer' : '')}">
        ${m.status === 'loa' ? '<div class="loa-badge">On Leave</div>' : ''}
        ${m.position ? `<div class="position-badge">${escapeHtml(m.position)}</div>` : ''}
        ${m.special_status ? `<div class="special-badge ${m.special_status}">${m.special_status === 'lifer' ? 'Lifer' : 'Retiree'}</div>` : ''}
        <div class="riding-name">${escapeHtml(m.riding_name)}</div>
        ${m.legal_name ? `<div class="legal-name">${escapeHtml(m.legal_name)}</div>` : ''}
        ${m.phone ? `<div class="detail-row"><a href="tel:${escapeHtml(m.phone.replace(/[^0-9+]/g, ''))}">${escapeHtml(m.phone)}</a></div>` : ''}
        ${m.email ? `<div class="detail-row"><a href="mailto:${escapeHtml(m.email)}">${escapeHtml(m.email)}</a></div>` : ''}
        ${m.birthday ? `<div class="detail-row">🎂 ${escapeHtml(m.birthday)}</div>` : ''}
        ${m.colors_year ? `<div class="since">${tenureLabel(m)}</div>` : ''}
        ${m.special_status && m.special_status_date ? `<div class="since">${m.special_status === 'lifer' ? 'Lifer' : 'Retiree'} since ${formatDate(m.special_status_date)}</div>` : ''}
        ${m.status === 'loa' && m.loa_start ? `<div class="loa-notes">On leave since ${formatDate(m.loa_start)}${m.loa_notes ? ' — ' + escapeHtml(m.loa_notes) : ''}</div>` : ''}
        ${loginBadge(m)}
        ${canManage ? `
          <div class="card-actions">
            <button class="icon-btn" onclick="editMember('${m.id}')">Edit</button>
            <button class="icon-btn danger" onclick="deleteMember('${m.id}')">Delete</button>
          </div>
        ` : ''}
      </div>
    `).join('');
  } else {
    const sorted = [...members].sort((a, b) => a.riding_name.localeCompare(b.riding_name));
    listDiv.className = 'former-list';
    listDiv.innerHTML = sorted.map(m => `
      <div class="former-row">
        <div>${m.special_status ? `<span class="special-badge ${m.special_status}">${m.special_status === 'lifer' ? 'Lifer' : 'Retiree'}</span>` : ''}<span class="riding-name">${escapeHtml(m.riding_name)}</span>${m.legal_name ? `<span class="legal-name">${escapeHtml(m.legal_name)}</span>` : ''}</div>
        <div>
          <span class="years">${m.colors_year ? m.colors_year + '–' : ''}${m.status_year || ''}${m.loa_years_total > 0 ? ` (${m.loa_years_total} yr LOA excluded)` : ''}</span>
          ${canManage ? `
            <button class="icon-btn" onclick="editMember('${m.id}')" style="margin-left:0.6rem;">Edit</button>
            <button class="icon-btn danger" onclick="deleteMember('${m.id}')">Delete</button>
          ` : ''}
        </div>
      </div>
    `).join('');
  }
}

document.getElementById('memberForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorDiv = document.getElementById('formError');
  const submitBtn = document.getElementById('mSubmit');

  const status = document.getElementById('mStatus').value;
  const specialStatus = document.getElementById('mSpecialStatus').value;
  const payload = {
    position: document.getElementById('mPosition').value || null,
    status,
    status_year: status === 'former' ? (numOrNull('mStatusYear')) : null,
    riding_name: document.getElementById('mRidingName').value.trim(),
    legal_name: document.getElementById('mLegalName').value.trim() || null,
    phone: document.getElementById('mPhone').value.trim() || null,
    email: document.getElementById('mEmail').value.trim() || null,
    birthday: document.getElementById('mBirthday').value.trim() || null,
    colors_year: numOrNull('mColorsYear'),
    loa_start: status === 'loa' ? (document.getElementById('mLoaStart').value || null) : null,
    loa_notes: status === 'loa' ? (document.getElementById('mLoaNotes').value.trim() || null) : null,
    loa_years_total: Number(document.getElementById('mLoaYearsTotal').value) || 0,
    special_status: specialStatus || null,
    special_status_date: specialStatus ? (document.getElementById('mSpecialStatusDate').value || null) : null
  };

  errorDiv.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving...';

  let result;
  if (editingId) {
    result = await sb.from('member_roster').update(payload).eq('id', editingId);
  } else {
    result = await sb.from('member_roster').insert([payload]);
  }

  submitBtn.disabled = false;
  submitBtn.textContent = 'Save Member';

  if (result.error) {
    errorDiv.textContent = result.error.message;
    errorDiv.classList.add('show');
    return;
  }

  resetMemberForm();
  await loadMembers();
});

function numOrNull(id) {
  const val = document.getElementById(id).value;
  return val === '' ? null : Number(val);
}

function editMember(id) {
  const m = allMembers.find(x => x.id === id);
  if (!m) return;
  editingId = m.id;
  document.getElementById('formTitle').textContent = 'Edit Member';
  document.getElementById('mPosition').value = m.position || '';
  document.getElementById('mStatus').value = m.status;
  document.getElementById('statusYearGroup').style.display = m.status === 'former' ? 'block' : 'none';
  document.getElementById('mStatusYear').value = m.status_year || '';
  document.getElementById('loaFieldsGroup').style.display = m.status === 'loa' ? 'grid' : 'none';
  document.getElementById('mLoaStart').value = m.loa_start || '';
  document.getElementById('mLoaNotes').value = m.loa_notes || '';
  document.getElementById('mLoaYearsTotal').value = m.loa_years_total || 0;
  document.getElementById('mSpecialStatus').value = m.special_status || '';
  document.getElementById('specialStatusDateGroup').style.display = m.special_status ? 'block' : 'none';
  document.getElementById('mSpecialStatusDate').value = m.special_status_date || '';
  document.getElementById('mRidingName').value = m.riding_name;
  document.getElementById('mLegalName').value = m.legal_name || '';
  document.getElementById('mPhone').value = m.phone || '';
  document.getElementById('mEmail').value = m.email || '';
  document.getElementById('mBirthday').value = m.birthday || '';
  document.getElementById('mColorsYear').value = m.colors_year || '';
  document.getElementById('mCancelBtn').style.display = 'inline-block';
  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
}

function resetMemberForm() {
  editingId = null;
  document.getElementById('formTitle').textContent = 'Add a Member';
  document.getElementById('memberForm').reset();
  document.getElementById('statusYearGroup').style.display = 'none';
  document.getElementById('loaFieldsGroup').style.display = 'none';
  document.getElementById('specialStatusDateGroup').style.display = 'none';
  document.getElementById('mCancelBtn').style.display = 'none';
  document.getElementById('formError').classList.remove('show');
}

async function deleteMember(id) {
  if (!confirm('Remove this person from the directory?')) return;
  const { error } = await sb.from('member_roster').delete().eq('id', id);
  if (error) {
    alert('Could not delete: ' + error.message);
    return;
  }
  allMembers = allMembers.filter(m => m.id !== id);
  render();
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

init();
</script>

</body>
</html>
