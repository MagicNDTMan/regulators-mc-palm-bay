<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Directory — Regulators MC Palm Bay, FL</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/centerpiece.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<style>
body { background: #0d0b10; }
.container { max-width: 900px; margin: 0 auto; padding: 2rem 1.2rem; }
.portal-card { background: #17131d; border: 1px solid #4b1f7a; border-top: 3px solid #7b2fbf; border-radius: 8px; padding: 2rem; margin-bottom: 1.5rem; }
.portal-card h2 { color: #eeeef2; margin-bottom: 1rem; font-family: "Oswald", sans-serif; }
.back-link { display: inline-block; margin-bottom: 1.2rem; color: #b98ae8; text-decoration: none; }
.back-link:hover { color: #eeeef2; }
.directory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.member-card { background: #0d0b10; border: 1px solid #4b1f7a; border-radius: 6px; padding: 1.2rem; }
.member-card .name { color: #eeeef2; font-family: "Oswald", sans-serif; font-size: 1.05rem; margin-bottom: 0.3rem; }
.member-card .role { color: #7b2fbf; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
.member-card .email { color: #c9c9d1; font-size: 0.85rem; word-break: break-all; }
.loading-text { color: #b98ae8; padding: 1rem 0; }
</style>
</head>
<body>

<header>
  <div class="nav-bar">
    <a class="nav-brand" href="index.html">
      <img src="assets/centerpiece.jpg" alt="Regulators MC logo">
      <span>Regulators MC<small>Palm Bay, FL</small></span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="#" onclick="signOutAndRedirect()">Logout</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="container">
  <a class="back-link" href="members.html">&larr; Back to Portal</a>
  <div class="portal-card">
    <h2>Member Directory</h2>
    <div id="directoryList" class="loading-text">Loading...</div>
  </div>
</div>

<script>
async function init() {
  const auth = await requireAuth();
  if (!auth) return;

  const { data: members, error } = await sb
    .from('profiles')
    .select('*')
    .order('name', { ascending: true });

  const listDiv = document.getElementById('directoryList');
  if (error) {
    listDiv.textContent = 'Could not load the directory.';
    return;
  }
  if (!members || members.length === 0) {
    listDiv.textContent = 'No members found.';
    return;
  }

  listDiv.className = 'directory-grid';
  listDiv.innerHTML = members.map(m => `
    <div class="member-card">
      <div class="name">${escapeHtml(m.name || 'Unnamed')}</div>
      <div class="role">${roleLabel(m.role)}</div>
      <div class="email">${escapeHtml(m.email)}</div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

init();
</script>

</body>
</html>
