<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mileage Tracker — Regulators MC Palm Bay, FL</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/centerpiece.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<style>
body { background: #0d0b10; }
.container { max-width: 900px; margin: 0 auto; padding: 2rem 1.2rem; }
.portal-card { background: #17131d; border: 1px solid #4b1f7a; border-top: 3px solid #7b2fbf; border-radius: 8px; padding: 2rem; margin-bottom: 1.5rem; }
.portal-card h2 { color: #eeeef2; margin-bottom: 1rem; font-family: "Oswald", sans-serif; }
.back-link { display: inline-block; margin-bottom: 1.2rem; color: #b98ae8; text-decoration: none; }
.back-link:hover { color: #eeeef2; }

.period-tabs { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.period-tab { padding: 0.5rem 1.2rem; background: #0d0b10; border: 1px solid #4b1f7a; border-radius: 999px; color: #c9c9d1; cursor: pointer; font-family: "Oswald", sans-serif; letter-spacing: 0.03em; font-size: 0.9rem; }
.period-tab.active { background: #7b2fbf; border-color: #7b2fbf; color: #fff; }

.mileage-table { width: 100%; border-collapse: collapse; }
.mileage-table th { text-align: left; color: #eeeef2; font-family: "Oswald", sans-serif; text-transform: uppercase; font-size: 0.8rem; padding: 0.6rem; border-bottom: 2px solid #4b1f7a; }
.mileage-table td { padding: 0.6rem; border-bottom: 1px solid #2a1145; color: #c9c9d1; }
.mileage-table tr:first-child td:first-child { position: relative; }
.rank-badge { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: #2a1145; color: #b98ae8; font-size: 0.75rem; font-weight: 600; margin-right: 0.5rem; }
.rank-badge.gold { background: #d4a72b; color: #0d0b10; }
.rank-badge.silver { background: #c9c9d1; color: #0d0b10; }
.rank-badge.bronze { background: #a86a3d; color: #0d0b10; }
.total-miles { color: #eeeef2; font-weight: 700; font-family: "Oswald", sans-serif; }
.in-progress { color: #7a7a85; font-style: italic; font-size: 0.85rem; }
.table-scroll { overflow-x: auto; }

.icon-btn { background: none; border: 1px solid #4b1f7a; color: #c9c9d1; padding: 0.2rem 0.55rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
.icon-btn:hover { border-color: #7b2fbf; color: #eeeef2; }
.icon-btn.danger { border-color: #d42b1e; color: #ff6b5a; }
.icon-btn.danger:hover { background: rgba(212,43,30,0.1); }

.form-group { margin-bottom: 1rem; }
.form-group label { display: block; color: #c9c9d1; font-size: 0.9rem; margin-bottom: 0.4rem; font-weight: 600; }
.form-group input { width: 100%; padding: 0.65rem; background: #0d0b10; border: 1px solid #4b1f7a; border-radius: 4px; color: #eeeef2; font-family: inherit; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
.submit-btn { padding: 0.7rem 1.5rem; background: #7b2fbf; color: #fff; border: none; border-radius: 4px; font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; }
.submit-btn:hover { background: #9345d6; }
.cancel-edit-btn { padding: 0.7rem 1.2rem; background: transparent; border: 1px solid #4b1f7a; color: #c9c9d1; border-radius: 4px; font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; margin-left: 0.6rem; }

.loading-text { color: #b98ae8; padding: 1rem 0; }
.error-text { color: #ff6b5a; padding: 0.5rem 0; display: none; }
.error-text.show { display: block; }
</style>
</head>
<body>

<header>
  <div class="nav-bar">
    <a class="nav-brand" href="index.html">
      <img src="assets/centerpiece.jpg" alt="Regulators MC logo">
      <span>Regulators MC<small>Palm Bay, FL</small></span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="#" onclick="signOutAndRedirect()">Logout</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="container">
  <a class="back-link" href="members.html">&larr; Back to Portal</a>

  <div class="portal-card" id="formCard" style="display:none;">
    <h2 id="formTitle">Log Mileage</h2>
    <div id="formError" class="error-text"></div>
    <form id="mileageForm">
      <div class="form-row">
        <div class="form-group">
          <label for="mPeriod">Period</label>
          <input id="mPeriod" type="text" list="periodOptions" placeholder="e.g. 2026–2027" required />
          <datalist id="periodOptions"></datalist>
        </div>
        <div class="form-group">
          <label for="mMember">Member Name</label>
          <input id="mMember" type="text" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="mBikeAStart">Bike A — Start</label>
          <input id="mBikeAStart" type="number" step="1" />
        </div>
        <div class="form-group">
          <label for="mBikeAEnd">Bike A — End</label>
          <input id="mBikeAEnd" type="number" step="1" />
        </div>
        <div class="form-group">
          <label for="mBikeBStart">Bike B — Start</label>
          <input id="mBikeBStart" type="number" step="1" />
        </div>
        <div class="form-group">
          <label for="mBikeBEnd">Bike B — End</label>
          <input id="mBikeBEnd" type="number" step="1" />
        </div>
      </div>
      <button type="submit" class="submit-btn" id="mSubmit">Save</button>
      <button type="button" class="cancel-edit-btn" id="mCancelBtn" style="display:none;" onclick="resetMileageForm()">Cancel</button>
    </form>
  </div>

  <div class="portal-card">
    <h2>Mileage Tracker</h2>
    <div class="period-tabs" id="periodTabs"></div>
    <div class="table-scroll">
      <table class="mileage-table">
        <thead><tr><th>Rider</th><th>Bike A</th><th>Bike B</th><th>Total</th><th></th></tr></thead>
        <tbody id="mileageTableBody"></tbody>
      </table>
    </div>
    <div id="mileageEmpty" class="loading-text" style="display:none;">No riders logged for this period yet.</div>
  </div>
</div>

<script>
let currentProfile = null;
let allRiders = [];
let selectedPeriod = null;
let editingRiderId = null;

async function init() {
  const auth = await requireAuth();
  if (!auth) return;
  currentProfile = auth.profile;

  if (isOfficerTier(currentProfile.role)) {
    document.getElementById('formCard').style.display = 'block';
  }

  await loadRiders();
}

async function loadRiders() {
  const { data, error } = await sb.from('mileage_log').select('*').order('created_at', { ascending: true });

  if (error) {
    document.getElementById('mileageTableBody').innerHTML = '';
    document.getElementById('mileageEmpty').style.display = 'block';
    document.getElementById('mileageEmpty').textContent = 'Could not load the mileage tracker.';
    return;
  }

  allRiders = data || [];
  const periods = [...new Set(allRiders.map(r => r.period_label))];
  document.getElementById('periodOptions').innerHTML = periods.map(p => `<option value="${escapeHtml(p)}"></option>`).join('');

  if (!selectedPeriod || !periods.includes(selectedPeriod)) {
    selectedPeriod = periods[periods.length - 1] || null;
  }
  document.getElementById('mPeriod').value = selectedPeriod || '';

  renderPeriodTabs(periods);
  render();
}

function renderPeriodTabs(periods) {
  const wrap = document.getElementById('periodTabs');
  wrap.innerHTML = periods.map(p => `<div class="period-tab" data-period="${escapeHtml(p)}" onclick="selectPeriod('${escapeHtml(p)}')">${escapeHtml(p)}</div>`).join('');
}

function selectPeriod(period) {
  selectedPeriod = period;
  render();
}

function bikeMiles(start, end) {
  if (start == null || end == null) return null;
  return Number(end) - Number(start);
}

function render() {
  document.querySelectorAll('.period-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.period === selectedPeriod);
  });

  const riders = allRiders.filter(r => r.period_label === selectedPeriod);
  const tbody = document.getElementById('mileageTableBody');
  const emptyDiv = document.getElementById('mileageEmpty');
  const canManage = isOfficerTier(currentProfile.role);

  if (riders.length === 0) {
    tbody.innerHTML = '';
    emptyDiv.style.display = 'block';
    emptyDiv.textContent = 'No riders logged for this period yet.';
    return;
  }
  emptyDiv.style.display = 'none';

  const withTotals = riders.map(r => {
    const aMiles = bikeMiles(r.bike_a_start, r.bike_a_end);
    const bMiles = bikeMiles(r.bike_b_start, r.bike_b_end);
    const total = (aMiles || 0) + (bMiles || 0);
    const hasAnyData = aMiles !== null || bMiles !== null;
    return { ...r, aMiles, bMiles, total, hasAnyData };
  }).sort((a, b) => b.total - a.total);

  const rankClasses = ['gold', 'silver', 'bronze'];

  tbody.innerHTML = withTotals.map((r, i) => `
    <tr>
      <td>${r.hasAnyData && i < 3 ? `<span class="rank-badge ${rankClasses[i]}">${i + 1}</span>` : ''}${escapeHtml(r.member_name)}</td>
      <td>${r.aMiles !== null ? r.aMiles.toLocaleString() + ' mi' : '<span class="in-progress">in progress</span>'}</td>
      <td>${r.bMiles !== null ? r.bMiles.toLocaleString() + ' mi' : '<span class="in-progress">—</span>'}</td>
      <td class="total-miles">${r.hasAnyData ? r.total.toLocaleString() + ' mi' : '—'}</td>
      <td>
        ${canManage ? `
          <button class="icon-btn" onclick="editRider('${r.id}')">Edit</button>
          <button class="icon-btn danger" onclick="deleteRider('${r.id}')">Delete</button>
        ` : ''}
      </td>
    </tr>
  `).join('');
}

document.getElementById('mileageForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorDiv = document.getElementById('formError');
  const submitBtn = document.getElementById('mSubmit');

  const payload = {
    period_label: document.getElementById('mPeriod').value.trim(),
    member_name: document.getElementById('mMember').value.trim(),
    bike_a_start: numOrNull('mBikeAStart'),
    bike_a_end: numOrNull('mBikeAEnd'),
    bike_b_start: numOrNull('mBikeBStart'),
    bike_b_end: numOrNull('mBikeBEnd')
  };

  errorDiv.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving...';

  let result;
  if (editingRiderId) {
    result = await sb.from('mileage_log').update(payload).eq('id', editingRiderId);
  } else {
    payload.created_by = currentProfile.id;
    result = await sb.from('mileage_log').insert([payload]);
  }

  submitBtn.disabled = false;
  submitBtn.textContent = 'Save';

  if (result.error) {
    errorDiv.textContent = result.error.message;
    errorDiv.classList.add('show');
    return;
  }

  const savedPeriod = payload.period_label;
  resetMileageForm();
  selectedPeriod = savedPeriod;
  await loadRiders();
});

function numOrNull(id) {
  const val = document.getElementById(id).value;
  return val === '' ? null : Number(val);
}

function editRider(id) {
  const r = allRiders.find(x => x.id === id);
  if (!r) return;
  editingRiderId = r.id;
  document.getElementById('formTitle').textContent = 'Edit Mileage';
  document.getElementById('mPeriod').value = r.period_label;
  document.getElementById('mMember').value = r.member_name;
  document.getElementById('mBikeAStart').value = r.bike_a_start ?? '';
  document.getElementById('mBikeAEnd').value = r.bike_a_end ?? '';
  document.getElementById('mBikeBStart').value = r.bike_b_start ?? '';
  document.getElementById('mBikeBEnd').value = r.bike_b_end ?? '';
  document.getElementById('mCancelBtn').style.display = 'inline-block';
  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
}

function resetMileageForm() {
  editingRiderId = null;
  document.getElementById('formTitle').textContent = 'Log Mileage';
  document.getElementById('mileageForm').reset();
  document.getElementById('mPeriod').value = selectedPeriod || '';
  document.getElementById('mCancelBtn').style.display = 'none';
  document.getElementById('formError').classList.remove('show');
}

async function deleteRider(id) {
  if (!confirm("Delete this rider's mileage entry?")) return;
  const { error } = await sb.from('mileage_log').delete().eq('id', id);
  if (error) {
    alert('Could not delete: ' + error.message);
    return;
  }
  allRiders = allRiders.filter(r => r.id !== id);
  render();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

init();
</script>

</body>
</html>
