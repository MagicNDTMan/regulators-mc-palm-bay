<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Regulators MC Palm Bay, FL</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/centerpiece.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #2a1145 0%, #0d0b10 100%);
  font-family: "Barlow", "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
}
.card {
  background: #17131d;
  border: 1px solid #4b1f7a;
  border-radius: 8px;
  padding: 2rem;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 0 30px rgba(123, 47, 191, 0.2);
}
.header { text-align: center; margin-bottom: 2rem; border-bottom: 2px solid #7b2fbf; padding-bottom: 1rem; }
.header h1 { font-family: "Oswald", sans-serif; font-size: 1.8rem; color: #eeeef2; margin: 0 0 0.5rem 0; letter-spacing: 0.1em; text-transform: uppercase; }
.header p { color: #b98ae8; font-size: 0.9rem; margin: 0; }
.card h2 { font-family: "Oswald", sans-serif; font-size: 1.3rem; color: #eeeef2; margin-bottom: 1.5rem; text-align: center; letter-spacing: 0.08em; text-transform: uppercase; }
.form-group { margin-bottom: 1.2rem; }
.form-group label { display: block; color: #c9c9d1; font-size: 0.9rem; margin-bottom: 0.5rem; font-weight: 600; }
.form-group input { width: 100%; padding: 0.7rem; background: #0d0b10; border: 1px solid #4b1f7a; border-radius: 4px; color: #eeeef2; font-size: 1rem; font-family: inherit; }
.form-group input:focus { outline: none; border-color: #7b2fbf; box-shadow: 0 0 8px rgba(123, 47, 191, 0.3); }
.submit { width: 100%; padding: 0.8rem; background: #7b2fbf; color: #fff; border: none; border-radius: 4px; font-family: "Oswald", sans-serif; font-size: 1rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
.submit:hover:not(:disabled) { background: #9345d6; }
.submit:disabled { opacity: 0.6; cursor: not-allowed; }
.error { background: rgba(212, 43, 30, 0.15); border: 1px solid #d42b1e; border-radius: 4px; padding: 0.8rem; color: #ff6b5a; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
.error.show { display: block; }
.success { background: rgba(75, 192, 75, 0.15); border: 1px solid #4bc04b; border-radius: 4px; padding: 0.8rem; color: #6fd36f; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
.success.show { display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Regulators MC</h1>
    <p>Palm Bay, FL</p>
  </div>

  <h2>Set New Password</h2>

  <div id="resetError" class="error"></div>
  <div id="resetSuccess" class="success"></div>

  <form id="resetForm">
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" required minlength="6" />
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" required minlength="6" />
    </div>
    <button type="submit" class="submit" id="resetSubmit">Update Password</button>
  </form>
</div>

<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorDiv = document.getElementById('resetError');
  const successDiv = document.getElementById('resetSuccess');
  const submitBtn = document.getElementById('resetSubmit');
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  errorDiv.classList.remove('show');
  successDiv.classList.remove('show');

  if (newPassword !== confirmPassword) {
    errorDiv.textContent = 'Passwords do not match';
    errorDiv.classList.add('show');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Updating...';

  const { error } = await sb.auth.updateUser({ password: newPassword });

  submitBtn.disabled = false;
  submitBtn.textContent = 'Update Password';

  if (error) {
    errorDiv.textContent = error.message;
    errorDiv.classList.add('show');
    return;
  }

  successDiv.textContent = 'Password updated! Redirecting to your portal...';
  successDiv.classList.add('show');
  setTimeout(() => {
    window.location.href = 'members.html';
  }, 1500);
});
</script>

</body>
</html>
